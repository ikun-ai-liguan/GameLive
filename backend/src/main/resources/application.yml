server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gamelive-backend

  # ---------- 数据库 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gamelive?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root

  # ---------- Redis（可选，不使用可整段注释） ----------
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 业务自定义配置 ----------
gamelive:
  # 流媒体服务地址（RTMP 推流 / FLV 拉流），按实际部署修改
  rtmp:
    push-prefix: rtmp://localhost:1935/live/
    flv-prefix: http://localhost:8081/live/
  jwt:
    secret: gamelive-dev-secret-key-please-change-in-production
    expire-hours: 24

logging:
  level:
    com.gamelive: debug
