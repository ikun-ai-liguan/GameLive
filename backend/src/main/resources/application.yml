server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gamelive-backend

  # ---------- 数据库（全部可通过环境变量覆盖） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gamelive}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false"
    username: ${DB_USER:root}
    password: ${DB_PASS:root}

  # ---------- Redis（可选，不使用可整段注释） ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 业务自定义配置 ----------
gamelive:
  # 流媒体服务地址（RTMP 推流 / FLV 拉流），与 docker/srs.conf 保持一致
  rtmp:
    push-prefix: ${RTMP_PUSH_PREFIX:rtmp://localhost:1935/live/}
    flv-prefix: ${FLV_PREFIX:http://localhost:8081/live/}
  jwt:
    secret: ${JWT_SECRET:gamelive-local-development-secret-key-change-me}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# ---------- 运维端点 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

logging:
  level:
    com.gamelive: debug
