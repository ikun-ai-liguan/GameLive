# 最小 SRS 5 配置：RTMP 1935 推流 + HTTP-FLV 8081 拉流（允许跨域）
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
    # 允许 flv.js 等浏览器播放器跨域拉取 HTTP-FLV 流
    crossdomain     on;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
